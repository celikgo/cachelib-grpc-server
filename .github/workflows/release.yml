name: Release

# Builds each architecture on a NATIVE runner and then merges them into one
# manifest list. The predecessor of this workflow built arm64 under QEMU
# emulation; those runs never finished inside the job limit, which is why some
# earlier versions shipped without an arm64 sibling. Do not reintroduce QEMU.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v)'
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cachelib-grpc-server

jobs:
  # Runs in ~15 seconds, ahead of a ~50-minute compile, and refuses to spend
  # that compute on a build that would not be reproducible. The pin is the one
  # input to this build that comes from outside the repository, so it is the
  # one input worth checking before anything expensive happens.
  pin:
    name: Upstream pin
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.read.outputs.ref }}
      short: ${{ steps.read.outputs.short }}
      repo: ${{ steps.read.outputs.repo }}
      date: ${{ steps.upstream.outputs.date }}
      behind: ${{ steps.upstream.outputs.behind }}
    steps:
      - uses: actions/checkout@v4

      # Drift guard. A commit SHA is immutable; a branch name is not. If this
      # ever becomes `main` (or a tag, which upstream can move), the build stops
      # being reproducible and this job fails the release rather than shipping
      # an image nobody can rebuild.
      - name: Pin must be an immutable commit SHA
        id: read
        run: |
          set -euo pipefail
          REF=$(grep -oE '^ARG CACHELIB_REF=[0-9a-f]{40}$' Dockerfile | head -1 | cut -d= -f2 || true)
          if [ -z "${REF:-}" ]; then
            echo "::error file=Dockerfile::CACHELIB_REF must pin a full 40-character commit SHA."
            echo "Upstream CacheLib moves fast; a branch or tag here makes the release unreproducible."
            echo "Found instead:"
            grep -n 'CACHELIB_REF' Dockerfile || echo "  (no CACHELIB_REF at all)"
            exit 1
          fi
          REPO=$(grep -oE '^ARG CACHELIB_REPO=[^[:space:]]+$' Dockerfile | head -1 | cut -d= -f2-)
          test -n "$REPO" || { echo "::error::no CACHELIB_REPO in Dockerfile"; exit 1; }
          {
            echo "ref=$REF"
            echo "short=${REF:0:12}"
            echo "repo=$REPO"
          } >> "$GITHUB_OUTPUT"
          echo "pinned to $REF of $REPO"

      # A SHA that does not exist upstream is just as unbuildable as a moving
      # branch -- it can happen after an upstream force-push, or from a typo.
      - name: Pin must resolve upstream
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF='${{ steps.read.outputs.ref }}'
          if ! DATE=$(gh api "repos/facebook/CacheLib/commits/$REF" \
                        --jq '.commit.committer.date' 2>/dev/null); then
            echo "::error::pinned revision $REF does not resolve in facebook/CacheLib."
            exit 1
          fi
          echo "date=${DATE%T*}" >> "$GITHUB_OUTPUT"
          echo "pin dates from ${DATE%T*}"

          # Informational only: how far the pin now trails upstream main. This
          # is deliberately NOT a failure -- the pin is meant to lag, and a
          # deliberate lag is documented in the Dockerfile. It is recorded in
          # the release notes so the distance is visible rather than forgotten.
          BEHIND=$(gh api "repos/facebook/CacheLib/compare/$REF...main" \
                     --jq '.ahead_by' 2>/dev/null || echo "")
          echo "behind=${BEHIND:-unknown}" >> "$GITHUB_OUTPUT"
          echo "upstream main is ${BEHIND:-unknown} commits ahead of the pin"

  # Two ~50-minute release runs were burned discovering, at the push step, that
  # GITHUB_TOKEN could not write to the package: it existed but had never granted
  # this repository Actions write access. GHCR issues a scoped token up front and
  # will say what it granted, so ask it before spending an hour compiling.
  #
  # Note that linking the package to a repository (via the image's
  # org.opencontainers.image.source label) is NOT the same thing and does NOT
  # grant this -- the access list is a separate, UI-only setting.
  preflight:
    name: Registry write access
    runs-on: ubuntu-latest
    steps:
      - name: GITHUB_TOKEN must be able to push to the package
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_PASS: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ github.repository_owner }}/cachelib-grpc-server
        run: |
          set -euo pipefail
          jwt=$(curl -fsSL -u "$GHCR_USER:$GHCR_PASS" \
                  "https://ghcr.io/token?service=ghcr.io&scope=repository:${PKG}:pull,push" \
                | jq -r '.token // empty') || jwt=""
          if [ -z "$jwt" ]; then
            echo "::warning::could not obtain a GHCR token; skipping preflight"
            exit 0
          fi
          # JWT payload is base64url without padding; restore both before decoding.
          payload=$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+' \
                    | awk '{ while (length($0) % 4) $0 = $0 "="; print }' \
                    | base64 -d 2>/dev/null) || payload=""
          if [ -z "$payload" ]; then
            echo "::warning::could not decode the GHCR token; skipping preflight"
            exit 0
          fi
          granted=$(printf '%s' "$payload" \
                    | jq -r '[.access[]? | select(.name == env.PKG) | .actions[]?] | join(",")')
          echo "granted on $PKG: ${granted:-<none>}"
          case ",$granted," in
            *,push,*) echo "push access confirmed"; exit 0 ;;
          esac
          echo "::error::GITHUB_TOKEN cannot push to ghcr.io/$PKG (granted: ${granted:-none})."
          echo "The package exists but has not granted this repository Actions write access."
          echo "Fix it at:"
          echo "  https://github.com/users/${{ github.repository_owner }}/packages/container/cachelib-grpc-server/settings"
          echo "  -> Manage Actions access -> Add repository -> cachelib-grpc-server -> role Write"
          exit 1

  build:
    name: Build ${{ matrix.arch }}
    needs: [pin, preflight]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - id: version
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Version declarations must agree
        run: |
          set -euo pipefail
          V='${{ steps.version.outputs.version }}'
          grep -Fqx "constexpr const char* kServerVersion = \"$V\";" <(grep 'kServerVersion =' CacheManager.h)
          grep -Eq "^project\(cachelib-grpc-server VERSION $V LANGUAGES CXX\)$" CMakeLists.txt
          grep -Fqx "# $V local Docker release benchmarks" <(head -1 "bench/strong/RELEASE-$V.md")
          python3 bench/strong/render_release_report.py \
            --results "bench/strong/release-$V-results" \
            --report "bench/strong/RELEASE-$V.md" --check
          test "${GITHUB_REF_NAME#v}" = "$V" || [ "${{ github.event_name }}" = workflow_dispatch ]

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and run the full test suite on ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tester
          platforms: linux/${{ matrix.arch }}
          push: false
          build-args: |
            CACHELIB_REF=${{ needs.pin.outputs.ref }}
            CACHELIB_REPO=${{ needs.pin.outputs.repo }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Load one native image, smoke that exact local binary, and only then
      # push it. The flat architecture tags remain a published interface.
      - name: Build the runtime candidate on ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: cachelib-release-candidate:local
          build-args: |
            CACHELIB_REF=${{ needs.pin.outputs.ref }}
            CACHELIB_REPO=${{ needs.pin.outputs.repo }}
            SERVER_VERSION=${{ steps.version.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Build correctness client
        run: docker build -f bench/investigation/Dockerfile.client -t cachelib-investigation-client:local .

      - name: Native runtime and DRAM + SSD smoke
        run: |
          scripts/release-smoke.sh cachelib-release-candidate:local \
            '${{ steps.version.outputs.version }}' \
            "/tmp/flash-smoke-${{ matrix.arch }}.json"

      - name: Push verified ${{ matrix.arch }} image and record digest
        run: |
          set -euo pipefail
          docker tag cachelib-release-candidate:local \
            "$IMAGE:${{ steps.version.outputs.version }}-${{ matrix.arch }}"
          docker push "$IMAGE:${{ steps.version.outputs.version }}-${{ matrix.arch }}"
          mkdir -p /tmp/digests
          docker buildx imagetools inspect \
            "$IMAGE:${{ steps.version.outputs.version }}-${{ matrix.arch }}" \
            --format '{{.Manifest.Digest}}' > /tmp/digests/${{ matrix.arch }}
          test -s /tmp/digests/${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.arch }}
          path: |
            /tmp/flash-smoke-${{ matrix.arch }}.json
            /tmp/flash-smoke-${{ matrix.arch }}-limits.json

  manifest:
    name: Merge versioned manifest
    needs: [pin, build]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.manifest.outputs.version }}
      list: ${{ steps.manifest.outputs.list }}
      amd64: ${{ steps.manifest.outputs.amd64 }}
      arm64: ${{ steps.manifest.outputs.arm64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: manifest
        run: |
          set -euo pipefail
          VERSION="${{ needs.build.outputs.version }}"
          AMD=$(cat /tmp/digests/amd64)
          ARM=$(cat /tmp/digests/arm64)
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            "$IMAGE@$AMD" "$IMAGE@$ARM"
          LIST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
                   --format '{{.Manifest.Digest}}')
          {
            echo "version=$VERSION"
            echo "list=$LIST"
            echo "amd64=$AMD"
            echo "arm64=$ARM"
          } >> "$GITHUB_OUTPUT"

      - name: Verify both architectures resolve
        run: |
          set -euo pipefail
          out=$(docker buildx imagetools inspect "$IMAGE:${{ steps.manifest.outputs.version }}")
          echo "$out"
          echo "$out" | grep -q linux/amd64
          echo "$out" | grep -q linux/arm64

      # The other half of the drift guard. The `pin` job proved the Dockerfile
      # pins an immutable revision; this proves the images we are about to
      # publish were actually compiled from that revision. Without this, the
      # revision printed in the release notes would be a claim about the
      # Dockerfile rather than a fact about the artefact.
      - name: Published images must carry the pinned revision
        run: |
          set -euo pipefail
          EXPECTED='${{ needs.pin.outputs.ref }}'
          VERSION='${{ steps.manifest.outputs.version }}'
          SOURCE='${{ github.sha }}'
          rc=0
          for arch in amd64 arm64; do
            digest=$(cat "/tmp/digests/$arch")
            # .Image is the config for a single-platform image, but a map
            # keyed by platform if buildx ever hands back a multi-platform
            # one. Accept either rather than silently reading "".
            got=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' \
                    | jq -r 'if has("config") then . else (to_entries[0].value) end
                             | .config.Labels["io.celikgo.cachelib.upstream.revision"] // ""')
            labels=$(docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' \
                    | jq -c 'if has("config") then . else (to_entries[0].value) end | .config.Labels')
            version=$(printf '%s' "$labels" | jq -r '."org.opencontainers.image.version" // ""')
            source=$(printf '%s' "$labels" | jq -r '."org.opencontainers.image.revision" // ""')
            if [ "$got" != "$EXPECTED" ] || [ "$version" != "$VERSION" ] || [ "$source" != "$SOURCE" ]; then
              echo "::error::$arch labels disagree: upstream=$got version=$version source=$source"
              rc=1
            else
              echo "$arch: upstream=$got version=$version source=$source"
            fi
          done
          exit $rc

      - name: Assemble release assets
        id: assets
        run: |
          set -euo pipefail
          V="${{ steps.manifest.outputs.version }}"
          GRPC=$(grep -oE '^ARG GRPC_REF=[0-9a-f]{40}$' Dockerfile | cut -d= -f2)
          BORINGSSL=$(grep -oE '^ARG BORINGSSL_REF=[0-9a-f]{40}$' Dockerfile | cut -d= -f2)
          BORINGSSL_SHA=$(grep -oE '^ARG BORINGSSL_ARCHIVE_SHA256=[0-9a-f]{64}$' Dockerfile | cut -d= -f2)
          test -n "$GRPC" && test -n "$BORINGSSL" && test -n "$BORINGSSL_SHA"
          mkdir -p dist

          # The service definition, so a client author can generate stubs from
          # the release without cloning the repository.
          cp proto/cache.proto dist/cache.proto

          # Machine-readable provenance: what to pull, and what it was built
          # from. This is the file to diff when asking "did anything about the
          # build inputs change between two releases?".
          cat > dist/provenance.json <<JSON
          {
            "version": "$V",
            "repository": "https://github.com/${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "image": "$IMAGE:$V",
            "digests": {
              "index": "${{ steps.manifest.outputs.list }}",
              "linux/amd64": "${{ steps.manifest.outputs.amd64 }}",
              "linux/arm64": "${{ steps.manifest.outputs.arm64 }}"
            },
            "upstream": {
              "project": "CacheLib",
              "repository": "${{ needs.pin.outputs.repo }}",
              "revision": "${{ needs.pin.outputs.ref }}",
              "revision_date": "${{ needs.pin.outputs.date }}",
              "commits_behind_upstream_main": "${{ needs.pin.outputs.behind }}",
              "vendored": false
            },
            "grpc": {
              "revision": "$GRPC",
              "boringssl_revision": "$BORINGSSL",
              "boringssl_archive_sha256": "$BORINGSSL_SHA"
            },
            "license": "Apache-2.0"
          }
          JSON
          jq . dist/provenance.json > /dev/null   # fail loudly on malformed JSON

          # Keep current and historical benchmark provenance distinct.
          for source in bench/strong/release-"$V"-results/*/summary.json; do
            kind=$(basename "$(dirname "$source")")
            cp "$source" "dist/benchmark-current-$kind.json"
          done
          cp "bench/strong/release-$V-results/campaign.json" dist/benchmark-current-campaign.json
          cp "bench/strong/RELEASE-$V.md" dist/comparative-report.md
          cp bench/strong/dependencies.arm64.json dist/benchmark-historical-20260923-dependencies.json
          cp bench/results-summary.json dist/benchmark-historical-1.6.json

          cp LICENSE dist/LICENSE
          cp NOTICE dist/NOTICE

          ( cd dist && sha256sum ./* > SHA256SUMS )
          ls -l dist

      - name: Write release notes
        run: |
          V="${{ steps.manifest.outputs.version }}"
          cat > notes.md <<NOTES
          ## Container images

          Multi-arch (\`linux/amd64\`, \`linux/arm64\`):

          \`\`\`bash
          docker pull $IMAGE:$V
          \`\`\`

          | Tag | Digest |
          |---|---|
          | \`$IMAGE:$V\` | \`${{ steps.manifest.outputs.list }}\` |
          | \`$IMAGE:$V-amd64\` | \`${{ steps.manifest.outputs.amd64 }}\` |
          | \`$IMAGE:$V-arm64\` | \`${{ steps.manifest.outputs.arm64 }}\` |

          Pin by digest for reproducible deployments:

          \`\`\`bash
          docker pull $IMAGE@${{ steps.manifest.outputs.list }}
          \`\`\`

          ## Upstream CacheLib

          This server consumes [Meta's CacheLib](https://github.com/facebook/CacheLib)
          as a build dependency; it is **not** vendored into this repository. These
          images were compiled against exactly one upstream revision, and the release
          workflow verifies that the published images carry it:

          | | |
          |---|---|
          | Upstream | [\`facebook/CacheLib\`](${{ needs.pin.outputs.repo }}) |
          | Revision | [\`${{ needs.pin.outputs.ref }}\`](https://github.com/facebook/CacheLib/commit/${{ needs.pin.outputs.ref }}) |
          | Revision date | ${{ needs.pin.outputs.date }} |
          | Commits behind upstream \`main\` | ${{ needs.pin.outputs.behind }} |

          Rebuild this source with the recorded version and revision labels:

          \`\`\`bash
          git clone https://github.com/${{ github.repository }} && cd cachelib-grpc-server
          git checkout v$V
          docker build --build-arg CACHELIB_REF=${{ needs.pin.outputs.ref }} \\
            --build-arg SERVER_VERSION=$V --build-arg SOURCE_REVISION=${{ github.sha }} \\
            -t cachelib-grpc-server .
          \`\`\`

          Package versions can change between builds; these inputs do not promise
          a bit-identical executable or image digest.

          CacheLib is licensed under Apache-2.0; see [\`NOTICE\`](https://github.com/${{ github.repository }}/blob/main/NOTICE).
          This project is not affiliated with, sponsored by, or endorsed by Meta Platforms, Inc.

          ## Comparative qualification

          The attached report and \`benchmark-current-campaign.json\` describe
          the fresh local Docker campaign for this version, generated from its
          retained raw results. They record the measured image IDs, source
          fingerprint, platform, environment, repetitions, and claim limitations.
          The September 23 candidate and historical 1.6.0 measurements remain
          separate evidence; they are not pooled into the current summaries.

          Read the report before making performance comparisons. Local Docker
          results do not establish physical SSD latency or native amd64
          performance. The release workflow builds and correctness-checks both
          native architectures from this tag; a newly built release digest must
          not be equated to the measured image without verifying its runtime
          identity or rerunning the measurements.
          Read the [versioned report](https://github.com/${{ github.repository }}/blob/v$V/bench/strong/RELEASE-$V.md)
          and [raw run manifests](https://github.com/${{ github.repository }}/tree/v$V/bench/strong/runs)
          before comparing workloads.

          ## Attached assets

          | File | What it is |
          |---|---|
          | \`cache.proto\` | Service definition, for generating clients without cloning |
          | \`provenance.json\` | Image digests and the exact upstream revision, machine-readable |
          | \`benchmark-current-*.json\` | Fresh campaign manifest and current-version comparative summaries; raw runs are in \`bench/strong/runs/\` |
          | \`comparative-report.md\` | Current-version implementation, flash, alternatives, and media assessment |
          | \`benchmark-historical-20260923-dependencies.json\` | Archived September 23 candidate dependencies and binary checksum, not the current release build |
          | \`benchmark-historical-1.6.json\` | Earlier, manually transcribed 1.6.0 summary behind [BENCHMARKS.md](https://github.com/${{ github.repository }}/blob/main/BENCHMARKS.md) |
          | \`LICENSE\`, \`NOTICE\` | Apache-2.0 and upstream attribution |
          | \`SHA256SUMS\` | Checksums for all of the above |

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          for what changed, and [BENCHMARKS.md](https://github.com/${{ github.repository }}/blob/main/BENCHMARKS.md)
          for measured performance.
          NOTES
          cat notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            notes.md
            dist/*

  verify:
    name: Pull and verify versioned ${{ matrix.arch }} image
    needs: manifest
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull immutable versioned index and validate native architecture
        run: |
          set -euo pipefail
          docker pull "$IMAGE@${{ needs.manifest.outputs.list }}"
          arch=$(docker image inspect "$IMAGE@${{ needs.manifest.outputs.list }}" \
            --format '{{.Architecture}}')
          test "$arch" = '${{ matrix.arch }}'
      - name: Build correctness client
        run: docker build -f bench/investigation/Dockerfile.client -t cachelib-investigation-client:local .
      - name: Versioned digest correctness and DRAM + SSD proof
        run: |
          scripts/release-smoke.sh "$IMAGE@${{ needs.manifest.outputs.list }}" \
            '${{ needs.manifest.outputs.version }}' \
            "/tmp/verify-flash-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: verify-${{ matrix.arch }}
          path: |
            /tmp/verify-flash-${{ matrix.arch }}.json
            /tmp/verify-flash-${{ matrix.arch }}-limits.json

  promote:
    name: Publish GitHub release, then promote latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [manifest, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: .
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate tag and attached provenance before publishing
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v${{ needs.manifest.outputs.version }}"
          test "$(jq -r .commit dist/provenance.json)" = "$GITHUB_SHA"
          test "$(jq -r .digests.index dist/provenance.json)" = '${{ needs.manifest.outputs.list }}'
          ( cd dist && sha256sum -c SHA256SUMS )
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.manifest.outputs.version }}
          body_path: notes.md
          generate_release_notes: true
          files: |
            dist/cache.proto
            dist/provenance.json
            dist/benchmark-current-*.json
            dist/comparative-report.md
            dist/benchmark-historical-20260923-dependencies.json
            dist/benchmark-historical-1.6.json
            dist/LICENSE
            dist/NOTICE
            dist/SHA256SUMS
      - name: Promote latest only after native and pulled-digest verification
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "$IMAGE:latest" "$IMAGE@${{ needs.manifest.outputs.list }}"
          got=$(docker buildx imagetools inspect "$IMAGE:latest" \
            --format '{{.Manifest.Digest}}')
          test "$got" = '${{ needs.manifest.outputs.list }}'

  postpublish:
    name: Verify published release on ${{ matrix.arch }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: [manifest, promote]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Published tag, latest, and digest agree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "v${{ needs.manifest.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" --json url --jq .url
          version_digest=$(docker buildx imagetools inspect \
            "$IMAGE:${{ needs.manifest.outputs.version }}" --format '{{.Manifest.Digest}}')
          latest_digest=$(docker buildx imagetools inspect \
            "$IMAGE:latest" --format '{{.Manifest.Digest}}')
          test "$version_digest" = '${{ needs.manifest.outputs.list }}'
          test "$latest_digest" = "$version_digest"
          docker pull "$IMAGE@$version_digest"
          arch=$(docker image inspect "$IMAGE@$version_digest" --format '{{.Architecture}}')
          test "$arch" = '${{ matrix.arch }}'
      - name: Build correctness client
        run: docker build -f bench/investigation/Dockerfile.client -t cachelib-investigation-client:local .
      - name: Post-publication binary and flash checks
        run: |
          scripts/release-smoke.sh "$IMAGE@${{ needs.manifest.outputs.list }}" \
            '${{ needs.manifest.outputs.version }}' \
            "/tmp/postpublish-flash-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: postpublish-${{ matrix.arch }}
          path: |
            /tmp/postpublish-flash-${{ matrix.arch }}.json
            /tmp/postpublish-flash-${{ matrix.arch }}-limits.json
