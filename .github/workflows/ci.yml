name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast structural checks. These gate the wire contract and the scripts and
  # finish in under a minute, so a broken proto never waits on a 90-minute
  # container build to be discovered.
  proto:
    name: Proto + scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Compile proto
        run: protoc --proto_path=proto --cpp_out=/tmp proto/cache.proto

      # Guards Apache-2.0 attribution: these files carry upstream Meta copyright
      # headers and must keep them. (cmake/Find*.cmake are original rewrites that
      # carry no upstream header, so they are not checked here.)
      - name: Upstream copyright headers are intact
        run: |
          missing=0
          for f in *.cc *.h proto/cache.proto CMakeLists.txt docker-compose.yml; do
            [ -e "$f" ] || continue
            if ! head -20 "$f" | grep -q "Copyright (c) Meta Platforms"; then
              echo "::error file=$f::upstream Meta copyright header missing"; missing=1
            fi
          done
          exit $missing

      - name: Verify LICENSE and NOTICE present
        run: test -f LICENSE && test -f NOTICE

      # A published performance number that nothing regenerates goes stale
      # silently. The tables in BENCHMARKS.md and README.md, and the one figure
      # quoted in prose, are rendered from bench/results-summary.json -- the
      # committed measurement. This fails the build if the markdown has drifted
      # from it, in about a second, on every push.
      - name: Benchmark tables match the committed measurement
        run: python3 bench/render.py --check

      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./bench

  # The container build clones upstream CacheLib at a pinned revision and
  # applies patches/ to it. Verifying that here takes ~20 seconds; discovering
  # it inside the image build costs 15 minutes and a much worse error message.
  patches:
    name: Patches apply to pinned upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned CacheLib revision
        id: ref
        run: |
          REF=$(grep -oE 'ARG CACHELIB_REF=[0-9a-f]{40}' Dockerfile | cut -d= -f2)
          test -n "$REF" || { echo "::error::no pinned CACHELIB_REF in Dockerfile"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "pinned to $REF"

      - name: Clone upstream at the pin
        run: |
          git clone --quiet https://github.com/facebook/CacheLib.git /tmp/cachelib
          git -C /tmp/cachelib checkout --quiet --detach ${{ steps.ref.outputs.ref }}

      - name: Patches must apply cleanly
        run: git -C /tmp/cachelib apply --check -v "$GITHUB_WORKSPACE"/patches/*.patch

      - name: Dependency graph must resolve
        run: |
          git -C /tmp/cachelib apply "$GITHUB_WORKSPACE"/patches/*.patch
          cd /tmp/cachelib
          python3 ./build/fbcode_builder/getdeps.py --allow-system-packages \
            list-deps cachelib > /tmp/deps.txt
          cat /tmp/deps.txt
          # This is the failure the pin originally exposed: a stale patch
          # referencing a manifest upstream had deleted.
          grep -qx cachelib /tmp/deps.txt

      - name: io_uring is actually disabled in folly
        run: |
          set -euo pipefail
          m=/tmp/cachelib/build/fbcode_builder/manifests/folly
          grep -qx 'FOLLY_USE_IO_URING=OFF' "$m"
          grep -qx 'Liburing_FOUND=OFF' "$m"
          grep -qx 'LIBURING_FOUND=OFF' "$m"
          # folly must not pull libaio itself. Note cachelib's own manifest
          # still declares libaio independently, so it legitimately remains in
          # the resolved graph -- do not assert on the graph here.
          if awk '/^\[dependencies.os=linux\]/{f=1;next} /^\[/{f=0} f' "$m" | grep -qx libaio; then
            echo "::error::folly still declares libaio; the io_uring patch did not apply"
            exit 1
          fi
          echo "io_uring disabled in folly as expected"

  # Smoke-test the RPC surface of the image built FROM THIS CHECKOUT.
  #
  # This job used to pull ghcr.io/celikgo/cachelib-grpc-server:latest, which is
  # whatever was last released -- so the fastest and most reassuring job in the
  # pipeline proved nothing whatsoever about the pull request it was running
  # on. It shares the buildx gha cache with the `build` job, so on a warm cache
  # it costs a couple of minutes rather than the full compile.
  smoke:
    name: Smoke test the image from this checkout
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build the image under test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cachelib-grpc-server:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start server
        run: |
          docker run -d --name cache -p 50051:50051 -p 9090:9090 \
            cachelib-grpc-server:pr
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' cache)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' cache | grep -q healthy

      - name: Install grpcurl
        run: |
          curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin grpcurl

      - name: Exercise the RPC surface
        run: |
          set -euo pipefail
          grpcurl -plaintext localhost:50051 list | grep -q cachelib.grpc.CacheService
          grpcurl -plaintext -d '{}' localhost:50051 cachelib.grpc.CacheService/Ping | grep -q PONG

          V=$(printf world | base64)
          grpcurl -plaintext -d "{\"key\":\"k1\",\"value\":\"$V\",\"ttl_seconds\":60}" \
            localhost:50051 cachelib.grpc.CacheService/Set | grep -q '"success": true'
          grpcurl -plaintext -d '{"key":"k1"}' \
            localhost:50051 cachelib.grpc.CacheService/Get | grep -q '"found": true'

          # Incr must stamp the TTL only on creation (ttl_set true, then false)
          grpcurl -plaintext -d '{"key":"rl1","delta":1,"ttl_seconds":60}' \
            localhost:50051 cachelib.grpc.CacheService/Incr | grep -q '"ttl_set": true'
          grpcurl -plaintext -d '{"key":"rl1","delta":1,"ttl_seconds":60}' \
            localhost:50051 cachelib.grpc.CacheService/Incr \
            | tee /dev/stderr | grep -q '"value": "2"'

          grpcurl -plaintext -d '{"key":"k1"}' \
            localhost:50051 cachelib.grpc.CacheService/Delete | grep -q '"key_existed": true'

      - name: Metrics endpoint responds
        run: curl -fsS localhost:9090/metrics | head -5

      # The README's Hybrid DRAM + SSD section tells users to run this. It threw
      # at startup for every released version -- configureNvmCache called
      # NavyConfig::enableAsyncIo() without setting the reader/writer thread
      # counts first -- and no job would have noticed, because nothing ever
      # started the server with --enable_nvm.
      - name: Hybrid DRAM + SSD tier starts and serves
        run: |
          set -euo pipefail
          docker run -d --name cache-nvm -p 50052:50051 cachelib-grpc-server:pr \
            --cache_size=134217728 --enable_nvm --nvm_path=/data/nvm/cache \
            --nvm_size=268435456
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' cache-nvm)" = healthy ] && break
            sleep 2
          done
          if [ "$(docker inspect -f '{{.State.Health.Status}}' cache-nvm)" != healthy ]; then
            echo "::error::the server did not come up with --enable_nvm"
            docker logs cache-nvm
            exit 1
          fi
          V=$(printf hybrid | base64)
          grpcurl -plaintext -d "{\"key\":\"h1\",\"value\":\"$V\"}" \
            localhost:50052 cachelib.grpc.CacheService/Set | grep -q '"success": true'
          grpcurl -plaintext -d '{"key":"h1"}' \
            localhost:50052 cachelib.grpc.CacheService/Get | grep -q '"found": true'
          grpcurl -plaintext -d '{}' localhost:50052 cachelib.grpc.CacheService/Stats \
            | grep -q '"nvmEnabled": true'

      - name: Server logs
        if: always()
        run: |
          docker logs cache
          docker logs cache-nvm 2>/dev/null || true

  # Full source build plus unit tests. Slow: compiles gRPC, folly, fbthrift and
  # CacheLib from source. amd64 only here; the arm64 build runs at release time
  # on a native arm64 runner.
  build:
    name: Build + unit tests (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build image and run unit tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tester
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
