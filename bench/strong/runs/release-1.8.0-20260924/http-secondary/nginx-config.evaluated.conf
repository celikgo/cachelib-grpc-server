worker_processes 2;
events { worker_connections 1024; }
http {
    upstream media_origin {
        server origin:8080;
        keepalive 32;
    }
    proxy_cache_path /data/cache levels=1:2 keys_zone=media:10m
                     max_size=512m inactive=1h use_temp_path=off;
    server {
        listen 8080;
        location /obj/ {
            proxy_pass http://media_origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_cache media;
            proxy_cache_lock on;
            proxy_cache_valid 200 1h;
            add_header X-Cache $upstream_cache_status always;
        }
    }
}
